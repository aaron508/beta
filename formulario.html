<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Evaluación</title>
    <style>
        body {
            background: linear-gradient(135deg, #ffcccb, #add8e6);
            font-family: Arial, sans-serif;
            color: #333;
            padding: 20px;
        }

        h1 {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2.5em;
            color: #003366;
            animation: textMove 3s infinite alternate;
        }

        p {
            font-size: 1.1em;
            font-style: italic;
        }

        label {
            font-weight: bold;
            color: #00509e;
        }

        input, select, textarea {
            font-family: 'Verdana', sans-serif;
            font-size: 1em;
            padding: 5px;
            margin-bottom: 10px;
            width: 100%;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        }

        input[type="submit"] {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }

        @keyframes textMove {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(15px);
            }
        }
    </style>
</head>
<body>
    <h1>Formulario de Evaluación</h1>
    <p>Por favor, evalúa esta página web y su contenido. Tus comentarios son valiosos para mejorar.</p>
    
    <form action="procesar_evaluacion.html" method="post">
        <label for="nombre">Tu Nombre:</label>
        <input type="text" id="nombre" name="nombre" required><br>
        
        <label for="email_usuario">Tu Correo Electrónico:</label>
        <input type="email" id="email_usuario" name="email_usuario" required><br>
        
        <label for="calificacion">Calificación General (1 a 5):</label>
        <select id="calificacion" name="calificacion" required>
            <option value="1">1 - Muy mala</option>
            <option value="2">2 - Mala</option>
            <option value="3">3 - Regular</option>
            <option value="4">4 - Buena</option>
            <option value="5">5 - Excelente</option>
        </select><br>
        
        <label for="contenido">Calificación del Contenido (1 a 5):</label>
        <select id="contenido" name="contenido" required>
            <option value="1">1 - Muy pobre</option>
            <option value="2">2 - Pobre</option>
            <option value="3">3 - Adecuado</option>
            <option value="4">4 - Bueno</option>
            <option value="5">5 - Excelente</option>
        </select><br>
        
        <label for="diseno">Calificación del Diseño (1 a 5):</label>
        <select id="diseno" name="diseno" required>
            <option value="1">1 - Muy pobre</option>
            <option value="2">2 - Pobre</option>
            <option value="3">3 - Adecuado</option>
            <option value="4">4 - Bueno</option>
            <option value="5">5 - Excelente</option>
        </select><br>
        
        <label for="navegacion">Facilidad de Navegación (1 a 5):</label>
        <select id="navegacion" name="navegacion" required>
            <option value="1">1 - Muy difícil</option>
            <option value="2">2 - Difícil</option>
            <option value="3">3 - Regular</option>
            <option value="4">4 - Fácil</option>
            <option value="5">5 - Muy fácil</option>
        </select><br>
        
        <label for="utilidad">Utilidad del Contenido (1 a 5):</label>
        <select id="utilidad" name="utilidad" required>
            <option value="1">1 - Nada útil</option>
            <option value="2">2 - Poco útil</option>
            <option value="3">3 - Regular</option>
            <option value="4">4 - Útil</option>
            <option value="5">5 - Muy útil</option>
        </select><br>
        
        <label for="comentarios">Comentarios Generales:</label>
        <textarea id="comentarios" name="comentarios" rows="4" cols="50" required></textarea><br>
        
        <label for="email_creador">Correo del Creador para Respuesta:</label>
        <input type="email" id="email_creador" name="email_creador" placeholder="torrejon.aaron_22071113@cetis054.edu.mx" required><br>
        
        <input type="submit" value="Enviar Evaluación">
    </form>
</body>
</html>
